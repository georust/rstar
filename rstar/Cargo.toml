[package]
name = "rstar"
version = "0.13.0"
authors = ["Stefan Altmayer <stoeoef@gmail.com>", "The Georust Developers <mods@georust.org>"]
description = "An R*-tree spatial index"
documentation = "https://docs.rs/rstar/"
repository = "https://github.com/georust/rstar"
license = "MIT OR Apache-2.0"
readme = "README.md"
edition = "2021"
rust-version = "1.85"
keywords = ["rtree", "r-tree", "spatial", "spatial-index", "nearest-neighbor"]
categories = ["data-structures", "algorithms", "science::geo"]

[badges]
maintenance = { status = "actively-developed" }

# docs.rs builds with default features unless told otherwise; enable everything so
# the feature-gated modules (geodetic, mint) are documented.
[package.metadata.docs.rs]
all-features = true

[dependencies]
heapless = { version = "0.8", default-features = false }
num-traits = { version = "0.2", default-features = false, features = ["libm"] }
serde = { version = "1.0", optional = true, default-features = false, features = ["alloc", "derive"] }
smallvec = "1.6"
mint = { version = "0.5.9", optional = true }
# Robust adaptive geometric predicates (orient3d) for the geodetic polygon point-in-
# polygon sign tests. Forced into no_std mode so the `geodetic` feature builds for a
# no_std target; no_std robust compiles fine under std too.
robust = { version = "1", optional = true, default-features = false, features = ["no_std"] }
# WGS84 geodesic (Karney) distances for the `geodetic-wgs84` refine. It is a `std`
# crate (it calls the inherent `f64` math methods), so it is gated behind
# `geodetic-wgs84` rather than `geodetic`, keeping the base `geodetic` feature
# no_std. `default-features = false` drops its `accurate` summation feature, matching
# rust-geo's use.
geographiclib-rs = { version = "0.2", optional = true, default-features = false }

[features]
default = []
debug = []
geodetic = ["dep:robust"]
# Spheroidal (WGS84) geodesic refine for the point tree, layered on the spherical
# index. Pulls in `geographiclib-rs` and so requires `std`; the base `geodetic`
# feature stays no_std.
geodetic-wgs84 = ["geodetic", "dep:geographiclib-rs"]

[dev-dependencies]
rand = "0.10"
rand_hc = "0.5"
approx = "0.5"
serde_json = "1.0"
nalgebra = { version = "0.34", features = ["mint"] }
